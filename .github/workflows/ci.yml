name: Tests and Debian package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest -v test_broadcast test_bot
      - run: bash -n install.sh
      - run: python -B packaging/test_package.py CLITests -v

  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python packaging/build_release.py
      - run: python packaging/export_source.py
      - run: python -B packaging/test_package.py -v
      - uses: actions/upload-artifact@v7
        with:
          name: url-bot-amd64
          if-no-files-found: error
          path: |
            url_bot.deb
            bot-linux-x86_64
            url_bot-source.zip
            SHA256SUMS
